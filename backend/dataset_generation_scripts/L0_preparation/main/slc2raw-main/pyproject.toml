[project]
name = "slc2raw"

description = "Trace coordinates from SLC to RAW"

readme = {file = "README.rst", content-type = "text/x-rst"}

authors = [
  { name = "Juan Manuel Cuerda (INTA)", email = "cuerdamjm@inta.es" },
  { name = "Cristina Hiedra (INTA)", email = "chiepri@inta.es" },
]

license = {text = "Apache-2.0"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

dependencies = [
  "numpy",
  "astropy"
]

dynamic = ["version"]

requires-python = ">=3.8"

[tool.setuptools]
packages = ["slc2raw"]

[tool.setuptools.dynamic]
version = {attr = "slc2raw.__version__"}

[project.scripts]
slc2raw = "slc2raw.__main__:main"

[build-system]
requires = ["setuptools>=61.0.0", "numpy", "astropy"]
build-backend = "setuptools.build_meta"
