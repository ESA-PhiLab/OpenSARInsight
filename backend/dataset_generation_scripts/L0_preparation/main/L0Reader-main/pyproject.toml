[project]
name = "L0Reader"

description = "Sentinel-1 RawData decoder"

readme = {file = "README.rst", content-type = "text/x-rst"}

authors = [
  { name = "Marcos Garcia (INTA)", email = "garciarm@inta.es" }
]

keywords = ["satellite", "decoder", "isp", "sentinel-1", "esa"]

license = {text = "Apache-2.0"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

dependencies = [
  "numpy",
]

dynamic = ["version"]

requires-python = ">=3.8"

[tool.setuptools]
packages = ["L0Reader"]

[tool.setuptools.dynamic]
version = {attr = "L0Reader.__version__"}

[project.scripts]
L0Reader = "L0Reader.__main__:main"

[build-system]
requires = ["setuptools>=61.0.0", "numpy"]
build-backend = "setuptools.build_meta"
