# ==========================
# Configuration file
# ==========================

input:
  # Base directory that contains the SLC/, GRD/, and binarymask/ folders.
  input_root: "/path/to/opensar/UAH_rfi_labeling/RFI_Codes_Python/inputs"

  # === Scene mapping CSV ===
  # Relative or absolute path to the CSV that maps scene number to GRD/SLC products.
  # If relative, it will be resolved relative to input_root.
  scene_mapping: "/path/to/opensar/UAH_rfi_labeling/RFI_Codes_Python/scene_mapping.csv"

  # === Scene selection ===
  # Scenes to process (1-based indices).
  #scenes_to_process:
  #  - 3          # single scene index
  #  - "5-9"      # inclusive range: 5,6,7,8,9
  #  - 12         # another single index

  # -----------------------------
  # Examples (uncomment as needed)
  # -----------------------------
  # Process a single scene only:
  scenes_to_process: [1]

output:
  # Output directory. Root directory where per-scene outputs will be written.
  # Launcher should create subfolders like <output_root>/scene_001/, scene_002/, etc.
  output_root: "/path/to/opensar/artifacts/dataset_generation/rfi_test"

